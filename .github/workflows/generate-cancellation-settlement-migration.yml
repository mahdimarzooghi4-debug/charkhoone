name: generate-cancellation-settlement-migration

on:
  push:
    branches:
      - feature/cancellation-owner-settlement-v1
    paths:
      - .github/workflows/generate-cancellation-settlement-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/cancellation-owner-settlement-v1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Charkhoone.slnx
      - name: Build
        run: dotnet build Charkhoone.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Charkhoone.slnx --configuration Release --no-build
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Generate migration
        run: |
          dotnet ef migrations add AddCancellationOwnerSettlement \
            --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj \
            --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj \
            --output-dir Persistence/Migrations
      - name: Commit migration and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Charkhoone.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration changes generated."
            exit 1
          fi
          git commit -m "feat(persistence): add cancellation owner settlement migration"
          git push origin HEAD:feature/cancellation-owner-settlement-v1
