name: generate-inbox-migration

on:
  push:
    branches:
      - feature/outbox-worker-v1

permissions:
  contents: write

jobs:
  generate:
    if: "${{ github.event.head_commit.message == 'ci: generate inbox migration' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Charkhoone.slnx
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Generate migration
        run: >-
          dotnet ef migrations add AddInboxMessages
          --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj
          --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj
          --context CharkhooneDbContext
          --output-dir Persistence/Migrations
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Charkhoone.Infrastructure/Persistence/Migrations
          git commit -m "feat(persistence): add inbox message migration"
          git push
