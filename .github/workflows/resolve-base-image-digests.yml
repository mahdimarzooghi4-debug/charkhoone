name: resolve-base-image-digests

on:
  push:
    branches:
      - feature/container-supply-chain-hardening-v1
    paths:
      - .github/workflows/resolve-base-image-digests.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/container-supply-chain-hardening-v1
      - name: Resolve registry manifest digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy

          accept='application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'

          read_digest_header() {
            awk 'BEGIN { IGNORECASE=1 } /^Docker-Content-Digest:/ { gsub("\r", "", $2); print $2; exit }'
          }

          resolve_mcr() {
            local key="$1"
            local repository="$2"
            local tag="$3"
            local digest
            digest="$(curl --fail --silent --show-error \
              --dump-header - --output /dev/null \
              -H "Accept: $accept" \
              "https://mcr.microsoft.com/v2/${repository}/manifests/${tag}" | read_digest_header)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not resolve MCR manifest digest for ${repository}:${tag}" >&2
              exit 1
            fi
            printf '%s=mcr.microsoft.com/%s:%s@%s\n' "$key" "$repository" "$tag" "$digest"
          }

          resolve_dockerhub() {
            local key="$1"
            local repository="$2"
            local tag="$3"
            local token digest
            token="$(curl --fail --silent --show-error \
              "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repository}:pull" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')"
            digest="$(curl --fail --silent --show-error \
              --dump-header - --output /dev/null \
              -H "Authorization: Bearer ${token}" \
              -H "Accept: $accept" \
              "https://registry-1.docker.io/v2/${repository}/manifests/${tag}" | read_digest_header)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not resolve Docker Hub manifest digest for ${repository}:${tag}" >&2
              exit 1
            fi
            printf '%s=%s:%s@%s\n' "$key" "${repository#library/}" "$tag" "$digest"
          }

          {
            echo '# Generated by GitHub Actions from registry manifest metadata.'
            echo '# Keep Dockerfiles/Compose pinned to these exact immutable references.'
            resolve_mcr DOTNET_SDK 'dotnet/sdk' '10.0'
            resolve_mcr DOTNET_ASPNET 'dotnet/aspnet' '10.0'
            resolve_mcr DOTNET_RUNTIME 'dotnet/runtime' '10.0'
            resolve_dockerhub NODE_RUNTIME 'library/node' '22-alpine'
            resolve_dockerhub NGINX_RUNTIME 'library/nginx' '1.29-alpine'
          } > deploy/base-images.lock

          cat deploy/base-images.lock

      - name: Commit generated digest lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/base-images.lock
          if git diff --cached --quiet; then
            echo 'base image digest lock is already current'
            exit 0
          fi
          git commit -m 'build(release): resolve base image digests'
          git push origin HEAD:feature/container-supply-chain-hardening-v1
