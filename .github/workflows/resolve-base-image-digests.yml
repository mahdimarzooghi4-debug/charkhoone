name: resolve-base-image-digests

on:
  push:
    branches:
      - feature/container-supply-chain-hardening-v1
    paths:
      - .github/workflows/resolve-base-image-digests.yml

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/container-supply-chain-hardening-v1
      - name: Resolve registry manifest digests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy

          resolve() {
            local key="$1"
            local image="$2"
            local resolved
            resolved="$(docker buildx imagetools inspect "$image" | awk '$1 == "Name:" { print $2; exit }')"
            if [[ ! "$resolved" =~ @sha256:[0-9a-f]{64}$ ]]; then
              echo "Could not resolve a sha256 manifest digest for $image: $resolved" >&2
              exit 1
            fi
            printf '%s=%s\n' "$key" "$resolved"
          }

          {
            echo '# Generated by GitHub Actions from registry manifest metadata.'
            echo '# Keep Dockerfiles/Compose pinned to these exact immutable references.'
            resolve DOTNET_SDK 'mcr.microsoft.com/dotnet/sdk:10.0'
            resolve DOTNET_ASPNET 'mcr.microsoft.com/dotnet/aspnet:10.0'
            resolve DOTNET_RUNTIME 'mcr.microsoft.com/dotnet/runtime:10.0'
            resolve NODE_RUNTIME 'node:22-alpine'
            resolve NGINX_RUNTIME 'nginx:1.29-alpine'
          } > deploy/base-images.lock

          cat deploy/base-images.lock

      - name: Commit generated digest lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/base-images.lock
          if git diff --cached --quiet; then
            echo 'base image digest lock is already current'
            exit 0
          fi
          git commit -m 'build(release): resolve base image digests'
          git push origin HEAD:feature/container-supply-chain-hardening-v1
