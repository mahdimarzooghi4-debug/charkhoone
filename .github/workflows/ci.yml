name: ci

on:
  push:
    branches: [main, "bootstrap/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CHARKHOONE_INTEGRATION_POSTGRES: Host=localhost;Port=5432;Database=charkhoone_integration;Username=postgres;Password=postgres
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=charkhoone_integration;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: charkhoone_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d charkhoone_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Charkhoone.slnx
      - name: Build
        run: dotnet build Charkhoone.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Charkhoone.slnx --configuration Release --no-build
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Verify no pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj
          --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj
          --no-build
          --configuration Release
      - name: Generate idempotent migration SQL
        run: |
          mkdir -p artifacts/database
          dotnet ef migrations script --idempotent \
            --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj \
            --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj \
            --no-build \
            --configuration Release \
            --output artifacts/database/migrations-idempotent.sql
          test -s artifacts/database/migrations-idempotent.sql
          grep -q '__EFMigrationsHistory' artifacts/database/migrations-idempotent.sql
      - name: Validate database operation scripts
        run: bash -n scripts/database/migrate.sh scripts/database/generate-idempotent-sql.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
