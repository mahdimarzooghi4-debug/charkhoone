name: ci

on:
  push:
    branches: [main, "bootstrap/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CHARKHOONE_INTEGRATION_POSTGRES: Host=localhost;Port=5432;Database=charkhoone_integration;Username=postgres;Password=postgres
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=charkhoone_integration;Username=postgres;Password=postgres
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: charkhoone_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d charkhoone_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify immutable CI dependency lock
        run: python3 scripts/release/verify-ci-dependency-pins.py
      - name: Verify deterministic Node dependency locks
        run: python3 scripts/release/verify-node-dependency-locks.py
      - name: Validate pilot scenario cohort runner
        run: |
          python3 -m py_compile scripts/pilot/run-scenario-cohort.py
          scenario_list="$(python3 scripts/pilot/run-scenario-cohort.py --list)"
          test "$(printf '%s\n' "$scenario_list" | wc -l)" -eq 9
          for scenario in success indeterminate retry decline needs-documents payment delinquency cancellation maturity; do
            printf '%s\n' "$scenario_list" | grep -q "^${scenario}: "
          done
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Charkhoone.slnx
      - name: Build
        run: dotnet build Charkhoone.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Charkhoone.slnx --configuration Release --no-build
      - name: Run minimum real PostgreSQL pilot scenario cohort
        env:
          CHARKHOONE_SCENARIO_ALLOW_POSTGRES: "true"
        run: >-
          python3 scripts/pilot/run-scenario-cohort.py
          --no-build
          --report artifacts/pilot-scenario-cohort/ci-summary.json
      - name: Upload pilot scenario cohort evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pilot-scenario-cohort-${{ github.sha }}
          path: artifacts/pilot-scenario-cohort/ci-summary.json
          if-no-files-found: error
          retention-days: 7
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Verify no pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj
          --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj
          --no-build
          --configuration Release
      - name: Generate idempotent migration SQL
        run: |
          mkdir -p artifacts/database
          dotnet ef migrations script --idempotent \
            --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj \
            --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj \
            --no-build \
            --configuration Release \
            --output artifacts/database/migrations-idempotent.sql
          test -s artifacts/database/migrations-idempotent.sql
          grep -q '__EFMigrationsHistory' artifacts/database/migrations-idempotent.sql
      - name: Validate database operation scripts
        shell: bash
        run: |
          for script in scripts/database/*.sh; do bash -n "$script"; done
          python3 -m py_compile scripts/database/*.py
          role_fixture=$(mktemp)
          trap 'rm -f "$role_fixture"' EXIT
          for code in \
            application_function_owner \
            application_table_owner \
            application_table_trigger_privilege \
            application_table_truncate_privilege \
            database_create_privilege \
            database_owner \
            public_schema_create_privilege \
            public_schema_owner \
            role_bypass_rls \
            role_create_db \
            role_create_role \
            role_replication \
            role_superuser; do
            printf '%s\t0\n' "$code" >> "$role_fixture"
          done
          python3 scripts/database/verify-runtime-role.py "$role_fixture"

      - name: Real PostgreSQL backup and clean restore drill
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/database/ci-backup-restore.sh
      - name: Smoke tests against restored data (no migrations or reseeding)
        env:
          CHARKHOONE_RESTORE_DRILL: "true"
          CHARKHOONE_INTEGRATION_POSTGRES: Host=localhost;Port=5432;Database=charkhoone_restore_drill;Username=postgres;Password=postgres
          ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=charkhoone_restore_drill;Username=postgres;Password=postgres
        run: >-
          dotnet test tests/Charkhoone.Api.IntegrationTests/Charkhoone.Api.IntegrationTests.csproj
          --configuration Release --no-build
          --filter FullyQualifiedName~RestoredDatabaseSmokeTests
          --logger "trx;LogFileName=restored-smoke.trx"
          --results-directory artifacts/database/restore-drill
      - name: Audit financial integrity on source and restored databases
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/database/ci-integrity-audit.sh
      - name: Collect runtime PostgreSQL evidence
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/database/ci-runtime-evidence.sh
      - name: Validate runtime role ownership and DDL bypass semantics
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/database/ci-runtime-role-audit.sh
      - name: Validate Npgsql/psql migration target identity binding semantics
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: bash scripts/database/ci-target-identity.sh
      - name: Validate query-plan evidence SQL against CI PostgreSQL
        env:
          CHARKHOONE_DATABASE_CONNECTION: postgresql://postgres:postgres@localhost:5432/charkhoone_integration
          CHARKHOONE_DATABASE_ENVIRONMENT: ci
          CHARKHOONE_QUERY_PLAN_EVIDENCE_PURPOSE: compatibility
          CHARKHOONE_ALLOW_QUERY_PLAN_EVIDENCE: "true"
          CHARKHOONE_DATABASE_EVIDENCE_DIR: artifacts/database/query-plans
        run: bash scripts/database/capture-query-plans.sh
      - name: Upload integrity audit counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-integrity-audit-${{ github.sha }}
          path: artifacts/database/integrity-audit/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload runtime database evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-runtime-evidence-${{ github.sha }}
          path: artifacts/database/runtime-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload query-plan compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-query-plan-compatibility-${{ github.sha }}
          path: artifacts/database/query-plans/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload restore drill evidence (no database dump)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-restore-drill-${{ github.sha }}
          path: artifacts/database/restore-drill/
          if-no-files-found: warn
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.1
      - name: Verify consistent web user-panel RTL and preview exit
        run: python3 ../../scripts/release/verify-web-user-panel-rtl.py
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.1
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck

  release-evidence:
    name: release-ci-gate
    runs-on: ubuntu-latest
    needs: [backend, web, mobile]
    if: ${{ always() }}
    steps:
      - name: Require successful release CI jobs
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          WEB_RESULT: ${{ needs.web.result }}
          MOBILE_RESULT: ${{ needs.mobile.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$WEB_RESULT" = success
          test "$MOBILE_RESULT" = success
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Write SHA-bound release CI evidence
        shell: bash
        run: |
          mkdir -p artifacts/release
          ci_dependency_lock_sha256="$(sha256sum deploy/ci-dependencies.lock | awk '{print $1}')"
          web_lock_sha256="$(sha256sum apps/web/package-lock.json | awk '{print $1}')"
          mobile_lock_sha256="$(sha256sum apps/mobile/package-lock.json | awk '{print $1}')"
          {
            printf 'environment=ci\n'
            printf 'git_sha=%s\n' "$GITHUB_SHA"
            printf 'workflow=ci\n'
            printf 'conclusion=success\n'
            printf 'backend=success\n'
            printf 'web=success\n'
            printf 'mobile_typecheck=success\n'
            printf 'mobile_build=not-claimed\n'
            printf 'ci_dependency_pins=verified\n'
            printf 'ci_dependency_lock_sha256=%s\n' "$ci_dependency_lock_sha256"
            printf 'node_dependency_locks=verified\n'
            printf 'node_version=22.13.1\n'
            printf 'web_package_lock_sha256=%s\n' "$web_lock_sha256"
            printf 'mobile_package_lock_sha256=%s\n' "$mobile_lock_sha256"
          } > artifacts/release/release-ci-evidence.txt
          cp deploy/ci-dependencies.lock artifacts/release/ci-dependencies.lock
      - name: Upload release CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-ci-evidence-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 30
