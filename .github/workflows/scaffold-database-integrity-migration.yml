name: scaffold-database-integrity-migration

on:
  push:
    branches:
      - feature/database-integrity-constraint-hardening-v1

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Charkhoone.slnx
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Scaffold migration when absent
        shell: bash
        run: |
          if ! compgen -G 'src/Charkhoone.Infrastructure/Persistence/Migrations/*_AddDatabaseIntegrityConstraints.cs' > /dev/null; then
            dotnet ef migrations add AddDatabaseIntegrityConstraints \
              --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj \
              --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj \
              --output-dir Persistence/Migrations
          fi
      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Charkhoone.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No generated migration changes to commit."
            exit 0
          fi
          git commit -m "feat(database): add integrity constraint migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: database-integrity-migration
          if-no-files-found: error
          path: |
            src/Charkhoone.Infrastructure/Persistence/Migrations/*_AddDatabaseIntegrityConstraints.cs
            src/Charkhoone.Infrastructure/Persistence/Migrations/*_AddDatabaseIntegrityConstraints.Designer.cs
            src/Charkhoone.Infrastructure/Persistence/Migrations/CharkhooneDbContextModelSnapshot.cs
