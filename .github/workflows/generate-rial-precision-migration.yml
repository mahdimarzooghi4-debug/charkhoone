name: generate-rial-precision-migration

on:
  push:
    branches: ["feature/rial-precision-v1"]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Charkhoone.slnx
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Generate migration
        run: >-
          dotnet ef migrations add UseUnscaledRialNumeric
          --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj
          --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj
          --context CharkhooneDbContext
          --output-dir Persistence/Migrations
      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: rial-precision-migration
          path: src/Charkhoone.Infrastructure/Persistence/Migrations/
