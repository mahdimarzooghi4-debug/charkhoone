name: staging-release-ops-validation

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "scripts/staging/**"
      - "docs/staging-application-smoke-release-gate-v1.md"
      - "docs/staging-release-promotion-evidence-v1.md"
      - ".github/workflows/staging-release-ops-validation.yml"
  pull_request:
    paths:
      - "scripts/staging/**"
      - "docs/staging-application-smoke-release-gate-v1.md"
      - "docs/staging-release-promotion-evidence-v1.md"
      - ".github/workflows/staging-release-ops-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate staging shell syntax
        shell: bash
        run: |
          for script in scripts/staging/*.sh; do
            bash -n "$script"
          done
      - name: Exercise promotion packet hash bindings
        shell: bash
        run: bash scripts/staging/ci-promotion-packet-fixture.sh
      - name: Exercise fail-closed evidence reruns and writer locks
        run: python3 scripts/staging/test-evidence-attempts.py
