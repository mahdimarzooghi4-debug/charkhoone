name: repository-governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: repository-governance-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify repository governance contract
        run: |
          python3 scripts/release/verify-ci-dependency-pins.py
          python3 scripts/release/verify-repository-governance.py
          bash -n scripts/release/check-base-image-drift.sh
          bash -n scripts/release/check-ci-dependency-drift.sh
          python3 scripts/release/verify-dependency-upstream-intake.py
      - name: Write SHA-bound governance evidence
        shell: bash
        run: |
          mkdir -p artifacts/repository-governance
          policy_sha256="$(sha256sum deploy/repository-governance.json | awk '{print $1}')"
          verifier_sha256="$(sha256sum scripts/release/verify-repository-governance.py | awk '{print $1}')"
          dependency_intake_verifier_sha256="$(sha256sum scripts/release/verify-dependency-upstream-intake.py | awk '{print $1}')"
          dependabot_config_sha256="$(sha256sum .github/dependabot.yml | awk '{print $1}')"
          base_image_drift_workflow_sha256="$(sha256sum .github/workflows/base-image-drift.yml | awk '{print $1}')"
          ci_dependency_drift_workflow_sha256="$(sha256sum .github/workflows/ci-dependency-drift.yml | awk '{print $1}')"
          ci_dependency_drift_script_sha256="$(sha256sum scripts/release/check-ci-dependency-drift.sh | awk '{print $1}')"
          cat > artifacts/repository-governance/evidence.txt <<EOF
          release_sha=${GITHUB_SHA}
          protected_branch=main
          repository_contract=verified
          dependency_upstream_intake_contract=verified
          required_status_checks=repository-governance-gate,release-ci-gate,container-release-gate,supply-chain-evidence-gate
          policy_sha256=${policy_sha256}
          verifier_sha256=${verifier_sha256}
          dependency_intake_verifier_sha256=${dependency_intake_verifier_sha256}
          dependabot_config_sha256=${dependabot_config_sha256}
          base_image_drift_workflow_sha256=${base_image_drift_workflow_sha256}
          ci_dependency_drift_workflow_sha256=${ci_dependency_drift_workflow_sha256}
          ci_dependency_drift_script_sha256=${ci_dependency_drift_script_sha256}
          github_branch_protection=enforcement-not-verified-by-workflow
          github_ruleset=enforcement-not-verified-by-workflow
          review_approval_count=organization-policy-not-defined
          EOF
          cp deploy/repository-governance.json artifacts/repository-governance/repository-governance.json
      - name: Upload repository governance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repository-governance-evidence-${{ github.sha }}
          path: artifacts/repository-governance/
          if-no-files-found: error
          retention-days: 30
