name: scaffold-database-integrity-enforcement-v2

on:
  push:
    branches:
      - feature/database-integrity-enforcement-v2

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Charkhoone.slnx
      - name: Install EF CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Regenerate migration from the final model
        shell: bash
        run: |
          migration=$(compgen -G 'src/Charkhoone.Infrastructure/Persistence/Migrations/*_AddDatabaseIntegrityEnforcementV2.cs' | head -n 1 || true)
          if [[ -n "$migration" ]] && grep -q 'journal_entry_seals' "$migration"; then
            dotnet ef migrations remove --force \
              --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj \
              --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj
            migration=''
          fi
          if [[ -z "$migration" ]]; then
            dotnet ef migrations add AddDatabaseIntegrityEnforcementV2 \
              --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj \
              --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj \
              --output-dir Persistence/Migrations
          fi
      - name: Commit generated migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Charkhoone.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No generated migration changes to commit."
            exit 0
          fi
          git commit -m "feat(database): regenerate integrity enforcement migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload generated migration
        uses: actions/upload-artifact@v4
        with:
          name: database-integrity-enforcement-v2-migration
          if-no-files-found: error
          path: |
            src/Charkhoone.Infrastructure/Persistence/Migrations/*_AddDatabaseIntegrityEnforcementV2.cs
            src/Charkhoone.Infrastructure/Persistence/Migrations/*_AddDatabaseIntegrityEnforcementV2.Designer.cs
            src/Charkhoone.Infrastructure/Persistence/Migrations/CharkhooneDbContextModelSnapshot.cs
