name: fix-and-generate-coverage-ledger

on:
  push:
    branches:
      - feature/coverage-replenishment-ledger-v1
    paths:
      - .github/workflows/fix-and-generate-coverage-ledger.yml

permissions:
  contents: write

jobs:
  fix-and-generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: feature/coverage-replenishment-ledger-v1
      - name: Fix coverage reconciliation range variable names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/Charkhoone.Infrastructure/Payments/EfTenantContributionCoverageService.cs')
          text = path.read_text()
          replacements = {
              'from coverage in dbContext.CoveragePayments.AsNoTracking()': 'from coverageRow in dbContext.CoveragePayments.AsNoTracking()',
              'join transaction in dbContext.ExternalTransactions.AsNoTracking()': 'join externalRow in dbContext.ExternalTransactions.AsNoTracking()',
              'on coverage.ExternalTransactionId equals transaction.Id': 'on coverageRow.ExternalTransactionId equals externalRow.Id',
              'where coverage.Id == coveragePaymentId': 'where coverageRow.Id == coveragePaymentId',
              'Coverage = coverage,': 'Coverage = coverageRow,',
              'transaction.IdempotencyKey,': 'externalRow.IdempotencyKey,',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Charkhoone.Infrastructure/Payments/EfTenantContributionCoverageService.cs
          git commit -m "fix(payments): resolve coverage reconciliation variable names"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Charkhoone.slnx
      - name: Build
        run: dotnet build Charkhoone.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Charkhoone.slnx --configuration Release --no-build
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Generate migration
        run: |
          dotnet ef migrations add AddTenantContributionCoverageLedger \
            --project src/Charkhoone.Infrastructure/Charkhoone.Infrastructure.csproj \
            --startup-project src/Charkhoone.Api/Charkhoone.Api.csproj \
            --output-dir Persistence/Migrations
      - name: Commit migration and push
        run: |
          git add src/Charkhoone.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "No migration changes generated."
            exit 1
          fi
          git commit -m "feat(persistence): add tenant contribution coverage ledger migration"
          git push origin HEAD:feature/coverage-replenishment-ledger-v1
