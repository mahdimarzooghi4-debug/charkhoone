name: resolve-mobile-lock

on:
  push:
    branches: ["feature/dependency-install-reproducibility-v1"]
    paths:
      - ".github/workflows/resolve-mobile-lock.yml"

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13
      - name: Generate and validate mobile lockfile with npm
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          cp package.json /tmp/mobile-package.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cmp package.json /tmp/mobile-package.json
          npm ci --no-audit --no-fund
          npm run typecheck
          test -s package-lock.json
      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- apps/mobile/package.json
          test -s apps/mobile/package-lock.json
          git add apps/mobile/package-lock.json
          git diff --cached --exit-code --quiet && { echo "lockfile was not generated" >&2; exit 1; }
          git diff --cached --name-only | grep -qx 'apps/mobile/package-lock.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(mobile): generate npm lockfile'
          git push origin HEAD:feature/dependency-install-reproducibility-v1
