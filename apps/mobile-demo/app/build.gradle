plugins { id 'com.android.application' }

android {
    namespace 'ir.charkhoone.demo'
    compileSdk 36
    defaultConfig {
        applicationId 'ir.charkhoone.demo'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0-demo'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug // Demo-only distribution; no production signing key.
        }
    }
}
